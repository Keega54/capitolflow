[project]
name = "capitolflow"
version = "1.0.0"
description = "Analysis of stock trading by members of Congress and executive-branch officials, keyed on trade date"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
capitolflow = "capitolflow.cli:main"

[tool.setuptools]
packages = ["capitolflow", "capitolflow.util", "capitolflow.sources",
            "capitolflow.parse", "capitolflow.analytics", "capitolflow.api"]

[tool.setuptools.package-data]
capitolflow = ["schema.sql", "web/*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
